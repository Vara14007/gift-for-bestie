<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Ambient Floating Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Card Layout */
    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 440px;
      text-align: center;
      z-index: 10;
      animation: fadeIn 0.8s ease-out;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #d81b60;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
    }
    p.question, p.wish-text {
      font-size: 1.1rem;
      color: #4a154b;
      margin-bottom: 25px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Inputs & Buttons */
    .input-group { margin-bottom: 20px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.6);
      outline: none;
      font-size: 1rem;
      text-align: center;
      color: #333;
    }
    .btn-submit, .btn-cake, .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #ff4081, #ff70a6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 64, 129, 0.35);
      transition: all 0.3s ease;
    }

    .error-msg { color: #d32f2f; font-size: 0.85rem; margin-top: 12px; display: none; }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    #screen2, #screen3, #screen4 { display: none; }

    /* Screen 2 Buttons */
    .btn-group {
      display: flex; justifyContent: center; align-items: center;
      gap: 20px; margin-top: 25px; height: 70px; position: relative;
    }
    .btn-yes {
      padding: 10px 28px; border-radius: 30px; border: none;
      background: linear-gradient(45deg, #2ecc71, #27ae60);
      color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-no {
      padding: 10px 28px; border-radius: 30px; border: none;
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
      position: absolute; transition: all 0.2s ease-out;
    }

    /* Cake Image Wrapper */
    .cake-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 15px auto;
      cursor: pointer;
    }
    .cake-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply; /* White background remove karne ke liye */
      filter: drop-shadow(0 10px 20px rgba(216, 27, 96, 0.22));
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cake-img.cut {
      transform: scale(1.08) rotate(3deg);
      filter: drop-shadow(0 15px 30px rgba(255, 64, 129, 0.45));
    }

    .knife-icon {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 3.5rem;
      transform: rotate(-40deg);
      transition: all 0.5s ease;
      z-index: 30;
