<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Ambient Floating Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Responsive Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
      z-index: 10;
      animation: fadeIn 0.8s ease-out;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #d81b60;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
    }
    p.question {
      font-size: 1.1rem;
      color: #4a154b;
      margin-bottom: 25px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* Screen 1 Styles */
    .input-group {
      margin-bottom: 20px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.6);
      outline: none;
      font-size: 1rem;
      text-align: center;
      color: #333;
      transition: all 0.3s ease;
    }
    input::placeholder {
      color: #666;
      font-size: 0.8rem;
    }
    input:focus {
      background: rgba(255, 255, 255, 0.9);
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.3);
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #ff4081, #ff70a6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 64, 129, 0.35);
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 64, 129, 0.5);
    }

    .error-msg {
      color: #d32f2f;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Screen 2 Styles */
    #screen2 {
      display: none;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 25px;
      height: 70px;
      position: relative;
    }
    .btn-yes {
      padding: 10px 28px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #2ecc71, #27ae60);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.35);
      transition: transform 0.2s ease;
    }
    .btn-yes:hover {
      transform: scale(1.08);
    }
    .btn-no {
      padding: 10px 28px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(231, 76, 60, 0.35);
      position: absolute;
      transition: all 0.2s ease-out;
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particle" style="width: 20px; height: 20px; left: 10%; animation-duration: 7s;"></div>
  <div class="particle" style="width: 15px; height: 15px; left: 30%; animation-duration: 9s;"></div>
  <div class="particle" style="width: 25px; height: 25px; left: 60%; animation-duration: 6s;"></div>
  <div class="particle" style="width: 12px; height: 12px; left: 80%; animation-duration: 8s;"></div>

  <!-- SCREEN 1: Password Page -->
  <div class="card" id="screen1">
    <h1>Hey Bestie! ✨</h1>
    <p class="question">Tum mujhe janti ho? 💖</p>
    
    <div class="input-group">
      <input type="password" id="passInput" placeholder="Meri bestie ka naam (jisse main bulaata hoon)">
    </div>
    
    <button class="btn-submit" onclick="checkPassword()">Enter ❤️</button>
    <p class="error-msg" id="errorMsg">Galat password! Dobara try karo ŷ</p>
  </div>

  <!-- SCREEN 2: Question Page -->
  <div class="card" id="screen2">
    <h1>Ek Chota Sa Sawal 🥺</h1>
    <p class="question">Kya tum meri bestie ban kr raho gi hamesha? 💖</p>
    
    <div class="btn-group" id="btnGroup">
      <button class="btn-yes" onclick="handleYesClick()">Haan, Hamesha! 💕</button>
      <button class="btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton()">Nahi 😜</button>
    </div>
  </div>

  <script>
    // Screen 1: Password Validation
    function checkPassword() {
      const input = document.getElementById('passInput').value;
      const card1 = document.getElementById('screen1');
      const errorMsg = document.getElementById('errorMsg');

      if (input === 'Pythone') {
        errorMsg.style.display = 'none';
        card1.style.display = 'none';
        document.getElementById('screen2').style.display = 'block';
        resetNoButtonPosition();
      } else {
        errorMsg.style.display = 'block';
        card1.classList.add('shake');
        setTimeout(() => {
          card1.classList.remove('shake');
        }, 400);
      }
    }

    document.getElementById('passInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    // Screen 2: Safe Inside-Card Dodging "No" Button Logic
    const noBtn = document.getElementById('noBtn');

    function resetNoButtonPosition() {
      noBtn.style.position = 'absolute';
      noBtn.style.right = '20px';
      noBtn.style.top = '50%';
      noBtn.style.transform = 'translateY(-50%)';
    }

    function moveNoButton() {
      // Card ke andar hi random safe positions define kar dete hain taki kabhi bahar na jaye
      const randomX = Math.floor(Math.random() * 180) - 90;
      const randomY = Math.floor(Math.random() * 80) - 40;
      
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Handle "Yes" Button Click
    function handleYesClick() {
      confetti({
        particleCount: 100,
        spread: 70,
      });
      
      setTimeout(() => {
        alert("Yayee! Besties Forever! 🎉💖");
        // Agla step yahan add karenge!
      }, 500);
    }
  </script>
</body>
</html>
